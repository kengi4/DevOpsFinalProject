name: CloudPulse CI/CD (Docker Hub + GCP Terraform)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'students/nikitatregubov/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline action to run'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

concurrency:
  group: cloudpulse-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test, Docker Build & Terraform Validate
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'deploy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'students/nikitatregubov/package-lock.json'

      - name: Install dependencies
        working-directory: students/nikitatregubov
        run: npm ci

      - name: Run syntax check
        working-directory: students/nikitatregubov
        run: npm run check

      - name: Run unit and HTTP API tests
        working-directory: students/nikitatregubov
        run: npm test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify production Docker build
        uses: docker/build-push-action@v6
        with:
          context: students/nikitatregubov
          push: false
          load: true
          tags: cloudpulse:ci-verify

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.2'

      - name: Check Terraform formatting
        working-directory: students/nikitatregubov/infra
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        working-directory: students/nikitatregubov/infra
        run: |
          terraform init -backend=false
          terraform validate

  build_and_push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.action == 'deploy')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: prep
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "Missing DOCKER_USERNAME or DOCKER_TOKEN repository secret." >&2
            exit 1
          fi
          DOCKER_USER_LOWER=$(printf '%s' "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          echo "image_ref=${DOCKER_USER_LOWER}/cloudpulse:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_ref=${DOCKER_USER_LOWER}/cloudpulse:latest" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: students/nikitatregubov
          push: true
          tags: |
            ${{ steps.prep.outputs.image_ref }}
            ${{ steps.prep.outputs.latest_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Provision GCP Infrastructure (Terraform)
    needs: build_and_push
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.action == 'deploy')
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.tf_output.outputs.vm_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GCP secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_TF_STATE_BUCKET }}" ] || [ -z "${{ secrets.GCE_SSH_KEY_B64 }}" ]; then
            echo "Missing one or more required secrets: GCP_SA_KEY, GCP_TF_STATE_BUCKET, GCE_SSH_KEY_B64." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.2'
          terraform_wrapper: false

      - name: Prepare Terraform input variables
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          else
            PROJECT_ID=$(jq -r '.project_id' "$GOOGLE_APPLICATION_CREDENTIALS")
          fi
          echo "TF_VAR_project_id=${PROJECT_ID}" >> "$GITHUB_ENV"

          SSH_USER="${{ secrets.GCE_SSH_USER }}"
          if [ -z "$SSH_USER" ]; then
            SSH_USER="devops"
          fi
          echo "TF_VAR_ssh_user=${SSH_USER}" >> "$GITHUB_ENV"

          if [ -n "${{ secrets.GCE_SSH_PUBLIC_KEY }}" ]; then
            SSH_PUB="${{ secrets.GCE_SSH_PUBLIC_KEY }}"
          else
            mkdir -p /tmp/tf_ssh && chmod 700 /tmp/tf_ssh
            printf '%s' "${{ secrets.GCE_SSH_KEY_B64 }}" | tr -d '[:space:]' | base64 -d | tr -d '\r' > /tmp/tf_ssh/id_key
            chmod 600 /tmp/tf_ssh/id_key
            SSH_PUB=$(ssh-keygen -y -f /tmp/tf_ssh/id_key < /dev/null)
            rm -rf /tmp/tf_ssh
          fi
          echo "::add-mask::${SSH_PUB}"
          echo "TF_VAR_ssh_public_key=${SSH_PUB}" >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: students/nikitatregubov/infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_TF_STATE_BUCKET }}" \
            -backend-config="prefix=students/nikitatregubov/terraform.tfstate"

      - name: Terraform Plan & Apply
        working-directory: students/nikitatregubov/infra
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Export Compute Engine VM IP
        id: tf_output
        working-directory: students/nikitatregubov/infra
        run: |
          VM_IP=$(terraform output -raw vm_external_ip)
          echo "vm_ip=${VM_IP}" >> "$GITHUB_OUTPUT"
          echo "Provisioned GCE VM IP: ${VM_IP}"

  deploy:
    name: Deploy Container to GCE VM
    needs: [build_and_push, terraform]
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.action == 'deploy')
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH private key and wait for VM SSH
        env:
          VM_IP: ${{ needs.terraform.outputs.vm_ip }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "${{ secrets.GCE_SSH_KEY_B64 }}" | tr -d '[:space:]' | base64 -d | tr -d '\r' > ~/.ssh/gce_deploy_key
          chmod 600 ~/.ssh/gce_deploy_key

          SSH_USER="${{ secrets.GCE_SSH_USER }}"
          if [ -z "$SSH_USER" ]; then
            SSH_USER="devops"
          fi

          for i in $(seq 1 30); do
            if ssh-keyscan -T 5 -H "$VM_IP" > ~/.ssh/known_hosts.tmp 2>/dev/null && [ -s ~/.ssh/known_hosts.tmp ]; then
              mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
              if ssh -i ~/.ssh/gce_deploy_key -o BatchMode=yes -o ConnectTimeout=5 "${SSH_USER}@${VM_IP}" true 2>/dev/null; then
                exit 0
              fi
            fi
            rm -f ~/.ssh/known_hosts.tmp
            echo "Waiting for SSH auth on ${VM_IP} (${i}/30)..."
            sleep 5
          done
          echo "Timed out waiting for SSH on ${VM_IP}" >&2
          exit 1

      - name: Pull and restart CloudPulse container on GCE
        env:
          VM_IP: ${{ needs.terraform.outputs.vm_ip }}
        run: |
          DOCKER_USER_LOWER=$(printf '%s' "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          IMAGE="${DOCKER_USER_LOWER}/cloudpulse:sha-${SHORT_SHA}"

          if [ -z "$DOCKER_USER_LOWER" ]; then
            echo "Missing DOCKER_USERNAME repository secret." >&2
            exit 1
          fi

          SSH_USER="${{ secrets.GCE_SSH_USER }}"
          if [ -z "$SSH_USER" ]; then
            SSH_USER="devops"
          fi

          ssh -i ~/.ssh/gce_deploy_key -o BatchMode=yes -o ConnectTimeout=15 "${SSH_USER}@${VM_IP}" bash -s -- "$IMAGE" "$SHORT_SHA" << 'EOF'
          set -euo pipefail
          IMAGE="$1"
          SHORT_SHA="$2"

          for i in $(seq 1 36); do
            if command -v docker >/dev/null 2>&1 && sudo systemctl is-active --quiet docker; then
              break
            fi
            echo "Waiting for Docker daemon on VM (${i}/36)..."
            sleep 5
          done

          if ! sudo systemctl is-active --quiet docker; then
            echo "Docker service did not become active on the VM." >&2
            exit 1
          fi

          sudo docker pull "$IMAGE"
          sudo docker stop cloudpulse 2>/dev/null || true
          sudo docker rm cloudpulse 2>/dev/null || true

          sudo docker run -d \
            --name cloudpulse \
            --restart unless-stopped \
            -p 80:3000 \
            -e NODE_ENV=production \
            -e APP_ENV=production \
            -e APP_VERSION="1.0.0-${SHORT_SHA}" \
            -e CLOUD_PROVIDER="Google Cloud Compute Engine" \
            "$IMAGE"

          sudo docker image prune -f >/dev/null 2>&1 || true
          sudo docker ps --filter "name=cloudpulse"
          EOF

      - name: Verify live HTTP health endpoint
        env:
          VM_IP: ${{ needs.terraform.outputs.vm_ip }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${VM_IP}/health" && echo "" && curl -fsS "http://${VM_IP}/api/info"; then
              echo ""
              echo "CloudPulse is live at http://${VM_IP}"
              exit 0
            fi
            echo "Waiting for HTTP health check on http://${VM_IP}/health (${i}/12)..."
            sleep 5
          done
          echo "Live health check failed for http://${VM_IP}/health" >&2
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/gce_deploy_key

  destroy:
    name: Destroy GCP Infrastructure (Manual)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GCP secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] || [ -z "${{ secrets.GCP_TF_STATE_BUCKET }}" ]; then
            echo "Missing GCP_SA_KEY or GCP_TF_STATE_BUCKET repository secret." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.2'
          terraform_wrapper: false

      - name: Prepare Terraform input variables
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          else
            PROJECT_ID=$(jq -r '.project_id' "$GOOGLE_APPLICATION_CREDENTIALS")
          fi
          echo "TF_VAR_project_id=${PROJECT_ID}" >> "$GITHUB_ENV"

          SSH_USER="${{ secrets.GCE_SSH_USER }}"
          if [ -z "$SSH_USER" ]; then
            SSH_USER="devops"
          fi
          echo "TF_VAR_ssh_user=${SSH_USER}" >> "$GITHUB_ENV"
          echo "TF_VAR_ssh_public_key=destroy-placeholder" >> "$GITHUB_ENV"

      - name: Terraform Destroy
        working-directory: students/nikitatregubov/infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.GCP_TF_STATE_BUCKET }}" \
            -backend-config="prefix=students/nikitatregubov/terraform.tfstate"
          terraform destroy -input=false -auto-approve
